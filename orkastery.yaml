# Manifesto do Orkastery (v1, bloco B0)
# Gerado por `ork init`. Fonte unica da configuracao do projeto.
# Limite duro de 16 KB: prosa longa vai para a memoria com tag, nao para este arquivo.

project:
  name: "orkastery"
  # abbrev: ate 3 caracteres [a-z0-9], parte 1 do slug de sessao, unica no workspace
  abbrev: "ork"
  stage: nascente

board:
  adapter: hermes-kanban
  default: default

runtime:
  # Runtimes homologados:
  #   claude-bg (padrao, mais maduro): despacha `claude --bg`, sessao visivel no app
  #             e em `claude agents --json`
  #   codex: despacha `codex exec` headless na sessao autenticada do Codex CLI,
  #          verificado no rollout de $CODEX_HOME/sessions (requer `codex login`)
  adapter: claude-bg
  model: opus
  effort: high
  # subscription-only: proibido despachar por provider pago (cobra por token, fora da assinatura)
  provider_policy: subscription-only
  # sandbox do runtime codex: read-only | workspace-write | danger-full-access
  # (danger-full-access SO onde o bubblewrap nao roda; `ork doctor` tem a sonda)
  sandbox: workspace-write
  # A entrada ork e os adapters removem credenciais pagas sob subscription-only.

conduction:
  # modo usado quando o pedido do builder nao traz #TAG
  default_mode: classic
  allowed_modes: [classic, maestro, auto, fast]

worktree:
  base_branch: "main"
  dir: ".claude/worktrees"
  por_thread: true
  # RM-037 (defeito 2 de 19 e 20/10/2026): o node_modules do core nao vem com o git worktree add. O ork roda este
  # comando dentro de toda worktree nova (thread new, worktree ensure); o cache do npm primeiro, a rede so para o que faltar.
  dependencias: "npm --prefix core ci --prefer-offline --no-audit --no-fund"

verify:
  build: "npm --prefix core run build"
  test: "npm --prefix core test"
  # typecheck: nao detectado
  # I-54 (RM-037): compila uma vez antes das claims e confere o produto do preparo ao fim da rodada.
  preparo: "npm --prefix core run build && npm --prefix core run build:test"
  # Security scan do proprio repositorio (ferramentas do catalogo em Docker). As fixtures vulneraveis de
  # proposito ficam fora pelo .ork-security/config.json.
  security_scan: "node core/dist/index.js security-scan"
  # RM-037: o teto global de 10 min nao cobre a suite quando o hipervisor rouba CPU. A mesma
  # suite mede 3,6 min com CPU livre (medido em 10/10/2026: 2753 testes, 0 falhas) e 24 a 30 min
  # com steal alto (sar de 23-24/09/2026). O runner hermetico faz `test:ci` herdar este mesmo
  # teto de `test`; build e demais comandos ficam no padrao.
  timeout_ms_por_comando:
    test: 2400000
    # Security scan medido em 19/10/2026 na estacao, imagens ja baixadas: 172 a 270 s (base = HEAD, e base
    # = merge-base com a main do upstream, que varre tambem a worktree da base e os commits da faixa).
    # O prazo e 3x o maior, arredondado ao minuto; no runner hospedado o pull frio das imagens soma 1 a 2 min.
    security_scan: 840000

check:
  # RM-072 (D2 do dono): Agile Check (padrao) ou Classic Check (o CHECK de sempre); `ork verify --check` vence.
  mode: agile
  agile:
    # Guarda de hash: claims e build reaproveitam o preparo enquanto a arvore e estes caminhos nao mudam.
    produto:
      - "core/dist"
      - "core/dist-test"
    # D14: o tsgo (TypeScript 7 nativo) emite dist e dist-test na arvore fria; com o build incremental do tsc presente,
    # roda o preparo do Classic. Paridade com o tsc 5.9.3 em core/scripts/tsgo-paridade.cjs; sem ela, comente a linha.
    preparo: "npm --prefix core run preparo:tsgo"
    # As lanes juntas no lugar do verify.test: o conjunto do test:ci e as integracoes locais (integracoes-locais.ts).
    test:
      hermetica: "npm --prefix core run test:hermetica"
      integracao: "npm --prefix core run test:integracao"
    # A integracao sobe containers (scan real, PostgreSQL): so comeca quando a varredura do grupo termina.
    apos_a_varredura: ["integracao"]

ci:
  # O SHIP consulta o check obrigatório no SHA candidato antes de tomar o lease da base.
  required_for_ship: true
  context: ork-verify
  # RM-058 (integração, D10): os quatro checks que a proteção da main exige. A prova do CI da entrega
  # do arco #Noctum exige todos verdes no SHA fonte; o ork ship segue lendo só o context acima.
  contexts:
    - "documentacao (markdownlint e paridade)"
    - "nucleo ork (build, testes, canarios) (20)"
    - "nucleo ork (build, testes, canarios) (22)"
    - "ork-verify"
  # O runner hospedado não oferece OrkMind/PostgreSQL local nem user namespaces. A suíte
  # hermética mantém essas integrações na verificação integral da estação de desenvolvimento.
  command: "npm --prefix core run test:ci"
  # RM-037 (defeito 5): repositorios externos cujo PR mesclado vale como entrega da thread
  # (ork ship registrar-pr <thread> --repo <dono/nome> --pr <n>). O valor e o check exigido no head
  # do PR; vazio declara repositorio sem CI. Os sites nao tem check run (medido em 29/09/2026).
  external_repositories:
    "orkastery/orkastery.com": ""
    "orkastery/orkmind.com": ""

concurrency:
  # 5 sessoes ao mesmo tempo (decisao do dono em 28/09/2026). A CPU fica protegida no kernel da
  # maquina, fora do ork: teto de CPU para o usuario que roda os agentes e monitor que avisa acima de 95%.
  max_parallel_threads: 5

handoff:
  # gate de tokens (bloco B1): rotaciona a sessao acima destas ocupacoes de janela
  rotate_above: 0.70
  force_rotate_above: 0.85

retry:
  # autonomia do bloco B3: retry tipado por motivo de gate e fila duravel de rate limit
  # max_tentativas e o LIMITE DE ESCALACAO: estourado, pausa qualquer modo, ate #Auto
  max_tentativas: 3
  # janela usada so quando o runtime diz "rate limit" e NAO diz a hora do reset
  janela_padrao_min: 60
  escalar_esforco: true

memory:
  # files = fallback honesto sem OrkMind (handoff por arquivos, ponteiro path#ancora)
  # orkmind = camada semantica do bloco B6 por cima, com degradacao honesta para files
  mode: orkmind
  tenant: orkastery
  # NOME da variavel de ambiente com a DSN da base PROPRIA deste tenant, nunca a DSN.
  # Banco governado do Company Brain: memória e projeção B1 no mesmo tenant.
  database_url_env: "ORKASTERY_BRAIN_READ_DATABASE_URL"
  cli: orkmind
  timeout_ms: 15000
  # I-38: embeddings da busca por significado (ork memory search --texto). provider none desliga.
  # api_key_env e o NOME da variavel com a chave dedicada, nunca o valor. O conteudo indexado do
  # tenant sai para o OpenRouter; subscription-only continua valendo para os runtimes.
  embedding:
    provider: "openrouter"
    model: "qwen/qwen3-embedding-8b"
    dim: 1024
    api_key_env: "ORKASTERY_EMBEDDING_API_KEY"
    fallback_model: "intfloat/multilingual-e5-small"
    max_tokens_por_execucao: 1000000

audit:
  # governanca de custo dos auditores periodicos (bloco B5, visao secao 5.3)
  # janela ociosa da assinatura: fora dela a rodada so anda com --agora <quem>
  janela_ociosa: "22:00-06:00"
  effort: eco
  since_padrao: 7d
  graphify: auto

grafo:
  # RM-031 KG5: tools ork_grafo_* (vizinhos, chamadores, importadores, caminho e contexto) no MCP do projeto,
  # com a evidencia de cada aresta. Desligada: ligar (true) e decisao do dono e vale para as sessoes
  # abertas depois. Sem o indice do HEAD a tool recusa e manda rodar ork grafo indexar.
  mcp: false

policies:
  provider: block
  segredo_em_prompt: block
  push_direto_na_base: block
  # RM-008 (fatia 3): licoes do loop que o ork confere sem ambiguidade. Warn registra e segue.
  verify_regression: warn
  verify_failed: warn
  runtime_unavailable: warn
  tree_blocked: warn
  # RM-062: barreira de dado privado no ork verify, no ork ci prepare e no passo do CI (ork privado varrer).
  # Comecou em warn e passou a block com a arvore medida em zero achado; excecoes em orkastery.privado.json.
  dado_privado: block
