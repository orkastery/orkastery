name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ork-verify:
    name: ork-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: instalar e compilar
        run: npm ci && npm run build
        working-directory: core
      # RM-037 (rm037noite, defeito 1): cada thread tem o proprio .ork-ci/<thread>.json, achado pela
      # branch da PR (GITHUB_HEAD_REF) ou pela do push (GITHUB_REF_NAME, a main: so os comandos).
      - name: CHECK independente
        run: node core/dist/index.js ci run --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

  # I-44: documentacao de produto e roadmap como codigo. O markdownlint cobre a FORMA do
  # Markdown; o `ork docs verificar` cobre frontmatter, leitura, referencias e paridade com o
  # codigo e com o git (por isso o historico inteiro: o commit de merge tem de estar na main).
  documentacao:
    name: documentacao (markdownlint e paridade)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: instalar e compilar
        run: npm ci && npm run build
        working-directory: core
      - name: forma do Markdown
        run: core/node_modules/.bin/markdownlint-cli2
      # RM-037 (fatia 3): no PR, o merge de outra thread com o item fora de Mesclado e o indice que
      # divergem da main so avisam; no push da main eles reprovam, e o PR de docs os corrige.
      - name: paridade com o codigo e o git
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node core/dist/index.js docs verificar --pr
          else
            node core/dist/index.js docs verificar
          fi
      - name: links relativos
        run: node core/scripts/checar-links.cjs
      # RM-037 (fatia 3, defeito 2): PR que muda core/, adapters/ ou marketplaces/ leva linha em
      # "Nao publicado" do CHANGELOG; PR so de testes ou so de CI fica de fora. No push da main a
      # base e o proprio HEAD, e nao ha o que conferir.
      - name: linha no CHANGELOG
        run: node core/scripts/checar-changelog.cjs --base "origin/${GITHUB_BASE_REF:-main}"
      # RM-049: o plugin dos marketplaces e copia gerada do catalogo; copia divergente reprova.
      - name: plugin dos marketplaces igual ao catalogo
        run: node core/scripts/gerar-marketplaces.cjs --verificar

  nucleo:
    name: nucleo ork (build, testes, canarios)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: instalar
        run: npm ci
        working-directory: core

      - name: compilar
        run: npm run build
        working-directory: core

      # A suite do nucleo roda em node --test, sem rede.
      - name: testes
        run: npm run test:ci
        working-directory: core

      # Canarios de comportamento + corpus das skills finas.
      # Sai diferente de zero em qualquer falha.
      - name: canarios e corpus das skills
        run: node core/dist/index.js eval

      # Template quebrado nao pode chegar a virar despacho.
      - name: lint dos templates de prompt
        run: node core/dist/index.js prompt lint

      - name: lint dos templates de auditoria
        run: node core/dist/index.js audit lint

      # RM-031: quem instala do npm tem o grafo. O tarball do npm pack, instalado global num prefixo
      # e num HOME temporarios, indexa e consulta um repositorio novo, e o doctor aponta a falta dos
      # analisadores com a correcao. A unica rede e a do registro do npm.
      - name: grafo no pacote instalado
        run: node core/scripts/provar-grafo-instalado.cjs

# Nota deliberada: `ork doctor` NAO roda aqui. Ele exige o runtime adapter
# instalado na maquina, e um runner de CI nao tem um. Rodar doctor no CI
# significaria ou um job vermelho por um motivo que nao e defeito, ou um
# doctor afrouxado para caber no CI. Nenhuma das duas serve. A prova do grafo
# no pacote instalado le do relatorio so o check dos analisadores, sem o veredito.
