name: Transporte autenticado da excecao

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  ork-excecao-transporte:
    name: ork-excecao-transporte
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].base.sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # O workflow_run nasce da target. A origem do PR nunca e executada neste job.
      - name: obter policy da target protegida
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          ref: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          path: .ork-protected-target
          persist-credentials: false

      - name: preparar Node da policy protegida
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: compilar leitor da target
        run: npm ci --prefix .ork-protected-target/core && npm --prefix .ork-protected-target/core run build

      - name: ler opt-in e pino da policy protegida
        id: transporte
        working-directory: .ork-protected-target
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const { exigirManifesto } = require('./core/dist/manifest');
          const config = exigirManifesto(process.cwd()).manifesto.ci.transporte_excecao;
          if (!config) {
            process.stdout.write('enabled=false\n');
          } else {
            process.stdout.write(`enabled=true\nversion=${config.cliente.versao}\nsha256=${config.cliente.sha256}\n`);
          }
          NODE

      - name: instalar cliente conferido por digest
        if: steps.transporte.outputs.enabled == 'true'
        working-directory: .ork-protected-target
        env:
          ORK_CLIENT_VERSION: ${{ steps.transporte.outputs.version }}
          ORK_CLIENT_SHA256: ${{ steps.transporte.outputs.sha256 }}
        run: |
          PACOTE="$(npm pack "@orkastery/cli@${ORK_CLIENT_VERSION}" --silent)"
          echo "${ORK_CLIENT_SHA256}  ${PACOTE}" | sha256sum --check --strict
          npm install --prefix "$RUNNER_TEMP/ork-protected-client" --no-audit --no-fund "./${PACOTE}"

      - name: consultar fabrica e expor somente resultado sanitizado
        if: steps.transporte.outputs.enabled == 'true'
        working-directory: .ork-protected-target
        run: node "$RUNNER_TEMP/ork-protected-client/node_modules/@orkastery/cli/dist/ci-fabrica-transporte.js"
