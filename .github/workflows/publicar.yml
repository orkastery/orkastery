# Publica o @orkastery/cli no npm por Trusted Publishing (OIDC): nenhum token nem senha fica em
# maquina nenhuma. O dono configura uma vez no npmjs.com: pacote @orkastery/cli > Settings >
# Trusted publishing > GitHub Actions, com organizacao `orkastery`, repositorio `orkastery` e
# workflow `publicar.yml`. Dispara pela tag `v<versao>` num commit da main, e so publica quando a
# tag bate com o package.json, os canarios do produto passam e o grafo roda no pacote instalado.
name: Publicar no npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  # RM-031: o pacote desta tag, instalado global num prefixo e num HOME temporarios, indexa e consulta
  # o grafo (a 0.5.0, a 0.5.1 e a 0.5.2 sairam sem os analisadores). Job proprio, so com leitura:
  # a prova instala as transitivas do registro, sem lockfile, e roda o codigo longe do id-token da publicacao.
  provar-grafo:
    name: grafo no pacote instalado
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # O mesmo npm do job que publica.
      - name: npm atual
        run: npm install -g npm@latest

      - name: instalar e compilar
        run: npm ci && npm run build
        working-directory: core

      - name: grafo no pacote instalado
        run: node core/scripts/provar-grafo-instalado.cjs

  publicar:
    name: publicar @orkastery/cli
    needs: provar-grafo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing exige npm 11.5.1 ou mais novo.
      - name: npm atual
        run: npm install -g npm@latest

      - name: a tag e a versao do pacote
        run: test "v$(node -p "require('./core/package.json').version")" = "$GITHUB_REF_NAME"

      # A prova de origem do npm exige a URL exata do repositorio que compila, com a mesma caixa.
      - name: a URL do repositorio no pacote
        run: test "$(node -p "require('./core/package.json').repository.url")" = "git+https://github.com/$GITHUB_REPOSITORY.git"

      - name: a tag esta na main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: instalar e compilar
        run: npm ci && npm run build
        working-directory: core

      - name: canarios do produto
        run: node core/dist/index.js eval --so-canarios

      - name: publicar
        run: npm publish --access public
        working-directory: core
