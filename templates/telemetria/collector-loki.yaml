receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:ORK_OTELCOL_GRPC_ENDPOINT}
      http:
        endpoint: ${env:ORK_OTELCOL_HTTP_ENDPOINT}

processors:
  memory_limiter:
    check_interval: ${env:ORK_OTELCOL_MEMORY_CHECK_INTERVAL}
    limit_mib: ${env:ORK_OTELCOL_MEMORY_LIMIT_MIB}
  filter/required:
    error_mode: propagate
    log_conditions:
      - 'IsMatch(log.event_name, "^orkastery\\.sdlc\\.")'
      - 'resource.attributes["service.name"] != "orkastery"'
      - 'scope.name != "orkastery.telemetria"'
      - 'log.attributes["log.record.uid"] == nil'
      - 'log.attributes["orkastery.thread.id"] == nil'
      - '(IsMatch(log.event_name, "^orkastery\\.ledger\\.phase_") or log.event_name == "gen_ai.client.inference.operation.details") and log.attributes["orkastery.phase.name"] == nil'
      - 'log.attributes["orkastery.prompt.content.state"] == "gap" and log.attributes["orkastery.prompt.gap.reason"] == nil'
      - 'log.attributes["orkastery.prompt.content.state"] == "gap" and log.attributes["gen_ai.input.messages"] != nil'
      - 'log.event_name == "gen_ai.client.inference.operation.details" and log.attributes["gen_ai.input.messages"] == nil and log.attributes["orkastery.prompt.content.state"] != "gap"'
  transform/sanitize:
    error_mode: propagate
    log_statements:
      - 'set(log.attributes["gen_ai.input.messages"], String(log.attributes["gen_ai.input.messages"])) where log.attributes["gen_ai.input.messages"] != nil'
      - 'keep_keys(log.attributes, ["log.record.uid", "user.hash", "vcs.ref.head.revision", "vcs.ref.head.name", "vcs.ref.type", "cicd.pipeline.name", "cicd.pipeline.run.id", "cicd.pipeline.result", "gen_ai.operation.name", "gen_ai.request.model", "gen_ai.conversation.id", "gen_ai.input.messages", "session.id", "error.type", "orkastery.thread.id", "orkastery.phase.name", "orkastery.dispatch.id", "orkastery.mode", "orkastery.decision.id", "orkastery.decision.reverts", "orkastery.claim.id", "orkastery.ledger.sequence", "orkastery.check.mode", "orkastery.receipt.id", "orkastery.receipt.contract", "orkastery.receipt.verdict", "orkastery.receipt.partial", "orkastery.receipt.head", "orkastery.receipt.policy.version", "orkastery.push.verified", "orkastery.go_fix.round", "orkastery.finding.id", "orkastery.policy.name", "orkastery.policy.reason", "orkastery.policy.writer", "orkastery.runtime.name", "orkastery.prompt.size", "orkastery.prompt.redaction.policy.version", "orkastery.prompt.size.original", "orkastery.prompt.size.exported", "orkastery.prompt.content.state", "orkastery.prompt.gap.reason", "orkastery.prompt.truncated", "orkastery.team.source.state"])'
      - 'keep_keys(resource.attributes, ["service.name", "service.version"])'
  filter/dora:
    error_mode: propagate
    log_conditions:
      - 'log.event_name != "orkastery.sdlc.deployment.v1" and log.event_name != "orkastery.sdlc.incident.v1"'
      - 'log.attributes["user.hash"] != nil or resource.attributes["service.namespace"] != nil'
      - 'resource.attributes["service.name"] == nil or resource.attributes["deployment.environment.name"] != "production"'
      - 'Len(resource.attributes) != 2'
      - 'log.attributes["log.record.uid"] == nil or log.attributes["orkastery.thread.id"] == nil'
      - 'log.event_name == "orkastery.sdlc.deployment.v1" and (Len(log.attributes) != 9 or log.attributes["deployment.id"] == nil or log.attributes["deployment.status"] != "succeeded" or log.attributes["cicd.pipeline.name"] == nil or log.attributes["cicd.pipeline.run.id"] == nil or log.attributes["cicd.pipeline.result"] != "success" or log.attributes["cicd.pipeline.task.type"] != "deploy" or log.attributes["vcs.ref.head.revision"] == nil)'
      - 'log.event_name == "orkastery.sdlc.incident.v1" and (log.attributes["orkastery.incident.id"] == nil or log.attributes["orkastery.incident.deployment.id"] == nil or (log.attributes["orkastery.incident.state"] != "opened" and log.attributes["orkastery.incident.state"] != "resolved"))'
      - 'log.event_name == "orkastery.sdlc.incident.v1" and log.attributes["orkastery.incident.state"] == "opened" and (Len(log.attributes) != 7 or log.attributes["error.type"] == nil)'
      - 'log.event_name == "orkastery.sdlc.incident.v1" and log.attributes["orkastery.incident.state"] == "resolved" and (Len(log.attributes) < 6 or Len(log.attributes) > 7 or log.attributes["error.type"] != nil)'
  transform/dora-sanitize:
    error_mode: propagate
    log_statements:
      - 'keep_keys(log.attributes, ["log.record.uid", "orkastery.thread.id", "deployment.id", "deployment.status", "cicd.pipeline.name", "cicd.pipeline.run.id", "cicd.pipeline.result", "cicd.pipeline.task.type", "vcs.ref.head.revision", "orkastery.incident.id", "orkastery.incident.state", "orkastery.incident.deployment.id", "orkastery.incident.recovery.deployment.id", "error.type"])'
      - 'keep_keys(resource.attributes, ["service.name", "deployment.environment.name"])'
  transform/dora-policy:
    error_mode: propagate
    log_statements:
      - 'set(resource.attributes["service.namespace"], "${env:ORK_DORA_SERVICE_NAMESPACE}") where "${env:ORK_DORA_SERVICE_NAMESPACE}" != ""'
      - 'set(log.attributes["orkastery.team.source.state"], "team_source_missing") where "${env:ORK_DORA_SERVICE_NAMESPACE}" == ""'
      - 'set(log.attributes["user.hash"], "${env:ORK_DORA_USER_HASH}") where "${env:ORK_DORA_USER_HASH}" != ""'
  batch: {}

exporters:
  otlphttp/loki:
    endpoint: ${env:LOKI_OTLP_ENDPOINT}

service:
  pipelines:
    logs/orkastery:
      receivers: [otlp]
      processors: [memory_limiter, filter/required, transform/sanitize, batch]
      exporters: [otlphttp/loki]
    logs/dora:
      receivers: [otlp]
      processors: [memory_limiter, filter/dora, transform/dora-sanitize, transform/dora-policy, batch]
      exporters: [otlphttp/loki]
