# ork-verify no GitLab CI. O job fixa a versão do cliente e preserva o histórico necessário ao replay.
# O projeto pode evitar pipeline duplicada de branch e MR com a regra de topo abaixo:
# workflow:
#   rules:
#     - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
#     - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
#       when: never
#     - if: '$CI_COMMIT_BRANCH'

ork-verify:
  stage: test
  image: node:22
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - ORK_VERSAO="${ORK_VERSAO:-0.6.11}"
    - npm install --global --ignore-scripts --no-audit --no-fund "@orkastery/cli@${ORK_VERSAO}"
    - ork ci run --branch "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_REF_NAME}"
