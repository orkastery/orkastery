# CI/CD Component do ork-verify para GitLab. O job fixa a versão do cliente e preserva o histórico necessário ao replay.
spec:
  inputs:
    contexto:
      description: "O nome do job: o check que o ork exige (ci.context)"
      default: ork-verify
    stage:
      description: "O stage do job"
      default: test
    imagem:
      description: "A imagem do job com Node"
      default: node:22
    versao_do_ork:
      description: "A versao exata do @orkastery/cli"
      default: "0.6.11"
      regex: ^\d+\.\d+\.\d+$
---
"$[[ inputs.contexto ]]":
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.imagem ]]
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - npm install --global --ignore-scripts --no-audit --no-fund "@orkastery/cli@$[[ inputs.versao_do_ork ]]"
    - ork ci run --branch "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_REF_NAME}"
