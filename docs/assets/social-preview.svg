<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1520"/>
      <stop offset="1" stop-color="#141E2D"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#fundo)"/>
  <rect x="48" y="48" width="1184" height="544" rx="28" fill="none" stroke="#2B3A50" stroke-width="2"/>

  <text x="96" y="150" font-family="Liberation Sans, FreeSans, sans-serif" font-size="30" font-weight="700" fill="#4FB6E8" letter-spacing="6">ORKASTERY</text>
  <text x="96" y="228" font-family="Liberation Sans, FreeSans, sans-serif" font-size="58" font-weight="700" fill="#E6EDF7">A software factory of AI agents</text>
  <text x="96" y="296" font-family="Liberation Sans, FreeSans, sans-serif" font-size="58" font-weight="700" fill="#F2A03D">that answers to you.</text>
  <text x="96" y="344" font-family="Liberation Sans, FreeSans, sans-serif" font-size="26" fill="#C9D8EC">Parallel work, proven results, and short decisions only when they matter.</text>
  <text x="96" y="382" font-family="Liberation Sans, FreeSans, sans-serif" font-size="22" fill="#8FA3BE">Uma fábrica de software de agentes de IA que presta contas a você.</text>

  <g transform="translate(0,12)" font-family="Liberation Mono, FreeMono, monospace" font-size="22" font-weight="700">
    <rect x="96" y="410" width="136" height="54" rx="10" fill="#18202E" stroke="#4FB6E8" stroke-width="2"/>
    <text x="164" y="445" text-anchor="middle" fill="#E6EDF7">GOAL</text>
    <text x="246" y="445" text-anchor="middle" fill="#54688A">›</text>
    <rect x="260" y="410" width="136" height="54" rx="10" fill="#18202E" stroke="#4FB6E8" stroke-width="2"/>
    <text x="328" y="445" text-anchor="middle" fill="#E6EDF7">PLAN</text>
    <text x="410" y="445" text-anchor="middle" fill="#54688A">›</text>
    <rect x="424" y="410" width="136" height="54" rx="10" fill="#18202E" stroke="#45C08A" stroke-width="2"/>
    <text x="492" y="445" text-anchor="middle" fill="#E6EDF7">GO</text>
    <text x="574" y="445" text-anchor="middle" fill="#54688A">›</text>
    <rect x="588" y="410" width="136" height="54" rx="10" fill="#18202E" stroke="#F2A03D" stroke-width="2"/>
    <text x="656" y="445" text-anchor="middle" fill="#E6EDF7">CHECK</text>
    <text x="738" y="445" text-anchor="middle" fill="#54688A">›</text>
    <rect x="752" y="410" width="136" height="54" rx="10" fill="#18202E" stroke="#45C08A" stroke-width="2"/>
    <text x="820" y="445" text-anchor="middle" fill="#E6EDF7">SHIP</text>
    <text x="902" y="445" text-anchor="middle" fill="#54688A">›</text>
    <rect x="916" y="410" width="136" height="54" rx="10" fill="#18202E" stroke="#F2A03D" stroke-width="2"/>
    <text x="984" y="445" text-anchor="middle" fill="#E6EDF7">MASTER</text>
  </g>

  <text x="96" y="540" font-family="Liberation Mono, FreeMono, monospace" font-size="24" fill="#C9D8EC">$ npm install -g @orkastery/cli</text>
  <text x="1184" y="540" text-anchor="end" font-family="Liberation Sans, FreeSans, sans-serif" font-size="22" fill="#54688A">Claude Code · Codex · MIT</text>
</svg>
